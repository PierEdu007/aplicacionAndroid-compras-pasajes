name: Compilar APK Android Tunky Chasky

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android Standalone Release APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: ☕ Configurar Java 17 (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🟢 Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Instalar dependencias npm
        run: npm install --legacy-peer-deps

      - name: 🏗️ Generar proyecto nativo Android (Prebuild)
        run: npx expo prebuild --platform android --no-install

      - name: ⚙️ Configurar permisos de Gradle
        run: chmod +x android/gradlew

      - name: 🔨 Compilar APK Standalone Release (Empaquetado Offline)
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: 📦 Preparar APK para descarga
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/release/app-release.apk build-output/TunkyChaskyAdmin.apk || cp android/app/build/outputs/apk/release/*.apk build-output/TunkyChaskyAdmin.apk
          cp build-output/TunkyChaskyAdmin.apk build-output/TunkyChaskyAdmin-v1.2.1.apk

      - name: 📤 Subir APK como Artefacto de Descarga
        uses: actions/upload-artifact@v4
        with:
          name: TunkyChaskyAdmin-APK
          path: build-output/*.apk
          retention-days: 30

      - name: 🚀 Publicar Release con Enlace de Descarga Directa
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.1
          name: Tunky Chasky Admin v1.2.1 (Auto-confirmación de Ventas Especiales y Eliminación de Facturas)
          body: |
            ## 📱 Aplicación Móvil Oficial - Tunky Chasky Admin v1.2.1

            Aplicación oficial de gestión de ventas y control de pasajes para **Inversiones Tunki Chasky S.R.L.**:

            ### 📥 Descarga Directa del Instalador APK:
            - **[TunkyChaskyAdmin.apk](https://github.com/${{ github.repository }}/releases/download/v1.2.1/TunkyChaskyAdmin.apk)** (Última versión)
            - **[TunkyChaskyAdmin-v1.2.1.apk](https://github.com/${{ github.repository }}/releases/download/v1.2.1/TunkyChaskyAdmin-v1.2.1.apk)**

            ---

            ### ✨ Novedades y Mejoras v1.2.1:
            - **⚡ Auto-confirmación de Ventas Especiales**: Las ventas y viajes especiales se confirman automáticamente y aparecen de inmediato en el panel de ventas.
            - **🗑️ Opción de Eliminar Facturas/Ventas Especiales**: Botón de eliminación con confirmación de seguridad para viajes especiales en caso de equivocación al emitir.
            - **🚐 Modo Viaje Especial sin Asientos**: Emisión rápida de viajes especiales con origen y destino en mayúsculas.
            - **🧾 Emisión Directa SUNAT (NubeFact)**: Facturas y boletas electrónicas oficiales con validación de RUC y DNI.
            - **🔍 Filtro Rápido de Viajes Especiales**: Pestaña dedicada en la pantalla de ventas para consultar viajes especiales al instante.
            - **📅 Calendario Táctil y Selector de Horarios**: Selección visual rápida de fechas y horas.
            - **📧 Envío Automático de Comprobantes**: Envío automático de boleta/factura en PDF al cliente.

            ---
            #### 📋 Instrucciones de Instalación:
            1. Descarga el archivo **`TunkyChaskyAdmin.apk`** en tu celular Android.
            2. Abre el archivo descargado.
            3. Si solicita permisos, selecciona **"Permitir instalar aplicaciones de esta fuente"**.
            4. Presiona **Instalar** y ¡listo!
          files: |
            build-output/TunkyChaskyAdmin.apk
            build-output/TunkyChaskyAdmin-v1.2.1.apk
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
