name: Compilar APK Android Tunky Chasky

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android Standalone Release APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: ☕ Configurar Java 17 (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🟢 Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Instalar dependencias npm
        run: npm install --legacy-peer-deps

      - name: 🏗️ Generar proyecto nativo Android (Prebuild)
        run: npx expo prebuild --platform android --no-install

      - name: ⚙️ Configurar permisos de Gradle
        run: chmod +x android/gradlew

      - name: 🔨 Compilar APK Standalone Release (Empaquetado Offline)
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: 📦 Preparar APK para descarga
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/release/app-release.apk build-output/TunkyChaskyAdmin.apk || cp android/app/build/outputs/apk/release/*.apk build-output/TunkyChaskyAdmin.apk
          cp build-output/TunkyChaskyAdmin.apk build-output/TunkyChaskyAdmin-v1.2.1.apk

      - name: 📤 Subir APK como Artefacto de Descarga
        uses: actions/upload-artifact@v4
        with:
          name: TunkyChaskyAdmin-APK
          path: build-output/*.apk
          retention-days: 30

      - name: 🚀 Publicar Release con Enlace de Descarga Directa
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.3
          name: Tunky Chasky Admin v1.2.3 (Campos Opcionales en Ventas Especiales y Respaldo NubeFact)
          body: |
            ## 📱 Aplicación Móvil Oficial - Tunky Chasky Admin v1.2.3

            Aplicación oficial de gestión de ventas y control de pasajes para **Inversiones Tunki Chasky S.R.L.**:

            ### 📥 Descarga Directa del Instalador APK:
            - **[TunkyChaskyAdmin.apk](https://github.com/${{ github.repository }}/releases/download/v1.2.3/TunkyChaskyAdmin.apk)** (Última versión)
            - **[TunkyChaskyAdmin-v1.2.3.apk](https://github.com/${{ github.repository }}/releases/download/v1.2.3/TunkyChaskyAdmin-v1.2.3.apk)**

            ---

            ### ✨ Novedades y Mejoras v1.2.3:
            - **📞 Correo y Celular Opcionales en Ventas Especiales**: En las ventas de rutas especiales ya no es obligatorio ingresar celular ni correo electrónico.
            - **🧾 Respaldo Automático NubeFact/SUNAT**: Los comprobantes oficiales emitidos quedan almacenados de forma permanente en la base de datos (con enlace al PDF oficial de SUNAT).
            - **🔧 Corrección de Restricción Única (idx_venta_unica)**: Asignación de identificadores de venta independientes para permitir infinitos viajes especiales sin colisiones.
            - **⚡ Auto-confirmación de Ventas Especiales**: Confirmación inmediata y visualización en tiempo real.
            - **🗑️ Opción de Eliminar Facturas/Ventas Especiales**: Botón de eliminación con confirmación de seguridad exclusivamente para viajes especiales.

            ---
            #### 📋 Instrucciones de Instalación:
            1. Descarga el archivo **`TunkyChaskyAdmin.apk`** en tu celular Android.
            2. Abre el archivo descargado.
            3. Si solicita permisos, selecciona **"Permitir instalar aplicaciones de esta fuente"**.
            4. Presiona **Instalar** y ¡listo!
          files: |
            build-output/TunkyChaskyAdmin.apk
            build-output/TunkyChaskyAdmin-v1.2.3.apk
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
