name: Compilar APK Android Tunky Chasky

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android Standalone Release APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: ☕ Configurar Java 17 (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🟢 Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Instalar dependencias npm
        run: npm install --legacy-peer-deps

      - name: 🏗️ Generar proyecto nativo Android (Prebuild)
        run: npx expo prebuild --platform android --no-install

      - name: ⚙️ Configurar permisos de Gradle
        run: chmod +x android/gradlew

      - name: 🔨 Compilar APK Standalone Release (Empaquetado Offline)
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: 📦 Preparar APK para descarga
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/release/app-release.apk build-output/TunkyChaskyAdmin.apk || cp android/app/build/outputs/apk/release/*.apk build-output/TunkyChaskyAdmin.apk

      - name: 📤 Subir APK como Artefacto de Descarga
        uses: actions/upload-artifact@v4
        with:
          name: TunkyChaskyAdmin-APK
          path: build-output/TunkyChaskyAdmin.apk
          retention-days: 30

      - name: 🚀 Publicar Release con Enlace de Descarga Directa
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.1.0
          name: Tunky Chasky Admin v1.1.0 (Calendario Táctil, Selector de Horas y Hora de Compra)
          body: |
            ## 📱 Tunky Chasky Admin v1.1.0
            
            ### 📥 Descarga Directa del Instalador APK:
            Descarga el archivo `TunkyChaskyAdmin.apk` adjunto abajo en tu teléfono celular Android e instálalo para actualizar la aplicación.
            
            ### ✨ Novedades y Mejoras v1.1.0:
            - **📅 Nuevo Calendario Táctil Mensual (`CalendarModal`)**: Selección visual de fechas en 1 solo toque, sin tener que escribir fechas manualmente con guiones.
            - **⏰ Nuevo Selector Visual de Horas (`TimePickerModal`)**: Horarios frecuentes y selector de horas/minutos sin escribir dos puntos ni equivocarse en el formato.
            - **⌨️ Corrección de Teclado Móvil (`KeyboardAvoidingView`)**: Los campos de texto (DNI, RUC, Nombres, Teléfono) ya no quedan cubiertos por el teclado del celular al rellenar información.
            - **🕐 Registro y Muestra de Hora Exacta de Compra**: Cada venta muestra la fecha y hora exacta en la que se realizó la reserva (`🕐 Comprado el: DD/MM/YYYY, hh:mm A`).
            - **Envío Automático de Correo con Boleta/Factura PDF y Boleto de Viaje**.
          files: build-output/TunkyChaskyAdmin.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
