name: Compilar APK Android Tunky Chasky

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android Standalone Release APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: ☕ Configurar Java 17 (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🟢 Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Instalar dependencias npm
        run: npm install --legacy-peer-deps

      - name: 🏗️ Generar proyecto nativo Android (Prebuild)
        run: npx expo prebuild --platform android --no-install

      - name: ⚙️ Configurar permisos de Gradle
        run: chmod +x android/gradlew

      - name: 🔨 Compilar APK Standalone Release (Empaquetado Offline)
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: 📦 Preparar APK para descarga
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/release/app-release.apk build-output/TunkyChaskyAdmin.apk || cp android/app/build/outputs/apk/release/*.apk build-output/TunkyChaskyAdmin.apk
          cp build-output/TunkyChaskyAdmin.apk build-output/TunkyChaskyAdmin-v1.3.0.apk

      - name: 📤 Subir APK como Artefacto de Descarga
        uses: actions/upload-artifact@v4
        with:
          name: TunkyChaskyAdmin-APK
          path: build-output/*.apk
          retention-days: 30

      - name: 🚀 Publicar Release con Enlace de Descarga Directa
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.0
          name: Tunky Chasky Admin v1.3.0 (Programación de Rutas, Calendario y Archivo XML SUNAT)
          body: |
            ## 📱 Aplicación Móvil Oficial - Tunky Chasky Admin v1.3.0

            Aplicación oficial de gestión de viajes, ventas y comprobantes electrónicos para **Inversiones Tunky Chasky S.R.L.**:

            ### 📥 Descarga Directa del Instalador APK:
            - **[TunkyChaskyAdmin.apk](https://github.com/${{ github.repository }}/releases/download/v1.3.0/TunkyChaskyAdmin.apk)** (Última versión lista para instalar)
            - **[TunkyChaskyAdmin-v1.3.0.apk](https://github.com/${{ github.repository }}/releases/download/v1.3.0/TunkyChaskyAdmin-v1.3.0.apk)**

            ---

            ### ✨ Novedades y Mejoras v1.3.0:
            - **📄 Archivo XML de SUNAT**: Botón directo para visualizar y descargar el archivo XML oficial emitido por NubeFact.
            - **🚀 Gestión de Salidas para Empleados**: Los usuarios con rol `EMPLEADO` y `VENDEDOR` ahora pueden crear y publicar salidas programadas (4P, 6P o ambas camionetas).
            - **🗺️ Registro Dinámico de Nuevas Rutas**: Agrega cualquier ruta con origen, destino y duración directamente desde el modal de creación.
            - **📅 Filtro de Calendario por Fecha Específica**: Selector visual de calendario para consultar salidas y ventas en cualquier fecha del año.
            - **🔍 Buscador Reactivo**: Búsqueda instantánea en vivo por ruta, hora, auto, DNI o pasajero.
            - **🧾 Detalle de Factura / Boleta**: Formato exacto RENIEC y fecha de viaje para servicios futuros.

            ---
            #### 📋 Instrucciones de Instalación:
            1. Descarga el archivo **`TunkyChaskyAdmin.apk`** en tu celular Android.
            2. Abre el archivo descargado.
            3. Si solicita permisos, selecciona **"Permitir instalar aplicaciones de esta fuente"**.
            4. Presiona **Instalar** e inicia sesión con tu usuario y contraseña.
          files: |
            build-output/TunkyChaskyAdmin.apk
            build-output/TunkyChaskyAdmin-v1.3.0.apk
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
