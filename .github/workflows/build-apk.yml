name: Compilar APK Android Tunky Chasky

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android Standalone Release APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: ☕ Configurar Java 17 (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🟢 Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Instalar dependencias npm
        run: npm install --legacy-peer-deps

      - name: 🏗️ Generar proyecto nativo Android (Prebuild)
        run: npx expo prebuild --platform android --no-install

      - name: ⚙️ Configurar permisos de Gradle
        run: chmod +x android/gradlew

      - name: 🔨 Compilar APK Standalone Release (Empaquetado Offline)
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: 📦 Preparar APK para descarga
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/release/app-release.apk build-output/TunkyChaskyAdmin.apk || cp android/app/build/outputs/apk/release/*.apk build-output/TunkyChaskyAdmin.apk

      - name: 📤 Subir APK como Artefacto de Descarga
        uses: actions/upload-artifact@v4
        with:
          name: TunkyChaskyAdmin-APK
          path: build-output/TunkyChaskyAdmin.apk
          retention-days: 30

      - name: 🚀 Publicar Release con Enlace de Descarga Directa
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.3
          name: Tunky Chasky Admin v1.0.3 (Venta Presencial, Horarios y Asientos 4P/6P)
          body: |
            ## 📱 Tunky Chasky Admin v1.0.3
            
            ### 📥 Descarga Directa:
            Descarga el archivo `TunkyChaskyAdmin.apk` adjunto abajo e instálalo en tu teléfono Android.
            
            ### ✨ Correcciones y Mejoras v1.0.3:
            - **Zona Horaria Perú (UTC-5)**: Fechas sincronizadas correctamente (Hoy 17 de Agosto / Mañana 18 de Agosto).
            - **Venta Presencial Renovada**:
              - Paso a paso claro: Fecha/Hora ➔ Tipo de Vehículo (4P ó 6P) ➔ Asiento.
              - Asiento #1 (Conductor) bloqueado y no seleccionable.
              - Camioneta 4P muestra exactamente 4 asientos de pasajero (#2 a #5).
              - Camioneta 6P muestra exactamente 6 asientos de pasajero (#2 a #7).
              - Campos de Celular/WhatsApp y Correo con etiquetas claras y placeholders legibles.
            - **Modo Inmersivo Permanente**: Los 3 botones de Android se mantienen ocultos incluso al salir y volver a la app.
            - **Aislamiento Total de Flota (4P y 6P)**: Cada vehículo opera de forma independiente sin cruce de asientos.
          files: build-output/TunkyChaskyAdmin.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
